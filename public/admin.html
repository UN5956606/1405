<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Админ-панель чата</title>
    <link rel="stylesheet" href="/admin.css">
</head>
<body>
    <div class="container">
        <div class="admin-header">
            <h1>Административная панель</h1>
            <a href="/" class="back-to-chat">Вернуться в чат</a>
        </div>
        <div class="tabs">
            <button class="tab-btn active" data-tab="users">Пользователи</button>
            <button class="tab-btn" data-tab="logs">Лог чата</button>
        </div>
        <div id="users-tab" class="tab-content active">
            <h2>Пользователи</h2>
            <table id="users-table">
                <thead>
                    <tr><th>ID</th><th>Имя</th><th>Роль</th><th>Дата регистрации</th><th>Действия</th></tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
        <div id="logs-tab" class="tab-content">
            <h2>Лог сообщений</h2>
            <table id="logs-table">
                <thead>
                    <tr><th>ID</th><th>Пользователь</th><th>Сообщение</th><th>Время</th><th>Действия</th></tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
    <script src="/admin.js"></script>
</body>
</html>
